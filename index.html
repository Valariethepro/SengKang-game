<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Forget the Lyrics! - Seng Kang Secondary Edition</title>
    <style>
        :root {
            --primary-teal: #008080;
            --secondary-navy: #0b2545;
            --accent-gold: #ffd700;
            --light-bg: #eef4f8;
            --dark-card: #13293d;
            --white: #ffffff;
            --success: #2ec4b6;
            --danger: #e71d36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-navy);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--dark-card);
            border: 3px solid var(--accent-gold);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .school-header {
            border-bottom: 2px solid var(--primary-teal);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .school-header h1 {
            color: var(--accent-gold);
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .school-header h2 {
            color: #a0c4ff;
            font-size: 1rem;
            margin-top: 4px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .lyric-box {
            background-color: #1d3557;
            border-left: 5px solid var(--accent-gold);
            padding: 18px;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
        }

        .missing-blank {
            color: var(--accent-gold);
            border-bottom: 2px dashed var(--accent-gold);
            padding: 0 8px;
            font-weight: bold;
            font-style: normal;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: 2px solid var(--primary-teal);
            border-radius: 8px;
            outline: none;
            margin-bottom: 15px;
            background-color: var(--light-bg);
            color: #333;
        }

        .btn {
            background-color: var(--primary-teal);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: #006666;
        }

        .lifelines {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-lifeline {
            background-color: #3a86ff;
            font-size: 0.85rem;
            padding: 8px 12px;
        }

        .btn-lifeline:disabled {
            background-color: #555;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 28px;
        }

        .feedback.correct { color: var(--success); }
        .feedback.wrong { color: var(--danger); }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="school-header">
        <h1>Seng Kang Secondary School</h1>
        <h2>Don't Forget the Lyrics!</h2>
    </div>

    <div id="game-screen">
        <div class="status-bar">
            <span>Round <span id="round-num">1</span>/5</span>
            <span>Score: <span id="score">0</span></span>
        </div>

        <div class="lyric-box" id="lyric-prompt">
            Loading song lyrics...
        </div>

        <input type="text" id="user-input" placeholder="Type the missing lyrics here..." autocomplete="off">
        <button class="btn" id="submit-btn" onclick="checkAnswer()">Lock In Answer</button>

        <div class="lifelines">
            <button class="btn btn-lifeline" id="hint-btn" onclick="useHint()">Hint (First Letter)</button>
        </div>

        <div class="feedback" id="feedback"></div>
    </div>

    <div id="end-screen" class="hidden">
        <h2>Game Over!</h2>
        <p style="margin: 15px 0; font-size: 1.2rem;">Your final score: <span id="final-score" style="color: var(--accent-gold); font-weight: bold;">0</span></p>
        <button class="btn" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
    const lyricsData = [
        {
            before: "Hold on! With the anchor to ",
            missing: "what we believe",
            after: "!"
        },
        {
            before: "Team up! Take the rope! ",
            missing: "Together we'll achieve",
            after: "!"
        },
        {
            before: "Breakthrough with ",
            missing: "heart and mind and soul",
            after: "."
        },
        {
            before: "Breakthrough for ",
            missing: "Seng Kang Secondary",
            after: "."
        },
        {
            before: "In this school we share one vision to which we all ",
            missing: "aspire",
            after: "."
        }
    ];

    let currentRound = 0;
    let score = 0;
    let hintUsed = false;

    function loadRound() {
        const data = lyricsData[currentRound];
        document.getElementById('round-num').innerText = currentRound + 1;
        document.getElementById('lyric-prompt').innerHTML = `"${data.before}<span class="missing-blank">???</span>${data.after}"`;
        document.getElementById('user-input').value = '';
        document.getElementById('feedback').innerText = '';
        document.getElementById('hint-btn').disabled = false;
        hintUsed = false;
    }

    function cleanString(str) {
        return str.toLowerCase().replace(/[^\w\s]/gi, '').trim();
    }

    function checkAnswer() {
        const userAns = document.getElementById('user-input').value;
        const targetAns = lyricsData[currentRound].missing;
        const feedback = document.getElementById('feedback');

        if (cleanString(userAns) === cleanString(targetAns)) {
            score += 100;
            document.getElementById('score').innerText = score;
            feedback.className = 'feedback correct';
            feedback.innerText = 'Correct! Breakthrough!';
            
            setTimeout(() => {
                currentRound++;
                if (currentRound < lyricsData.length) {
                    loadRound();
                } else {
                    endGame();
                }
            }, 1500);
        } else {
            feedback.className = 'feedback wrong';
            feedback.innerText = `Wrong! The correct lyric was: "${targetAns}"`;
            
            setTimeout(() => {
                currentRound++;
                if (currentRound < lyricsData.length) {
                    loadRound();
                } else {
                    endGame();
                }
            }, 2500);
        }
    }

    function useHint() {
        if (hintUsed) return;
        const targetAns = lyricsData[currentRound].missing;
        const firstLetter = targetAns.charAt(0);
        const feedback = document.getElementById('feedback');
        feedback.className = 'feedback';
        feedback.innerText = `Hint: The missing phrase starts with '${firstLetter.toUpperCase()}'`;
        document.getElementById('hint-btn').disabled = true;
        hintUsed = true;
    }

    function endGame() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
    }

    function restartGame() {
        currentRound = 0;
        score = 0;
        document.getElementById('score').innerText = 0;
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadRound();
    }

    loadRound();
</script>
</body>
</html>
