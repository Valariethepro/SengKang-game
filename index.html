<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Forget the Lyrics! - Seng Kang Secondary Edition</title>
    <style>
        :root {
            --primary-teal: #008080;
            --secondary-navy: #0b2545;
            --accent-gold: #ffd700;
            --light-bg: #eef4f8;
            --dark-card: #13293d;
            --white: #ffffff;
            --success: #2ec4b6;
            --danger: #e71d36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--secondary-navy);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--dark-card);
            border: 3px solid var(--accent-gold);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .school-header {
            border-bottom: 2px solid var(--primary-teal);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .school-header h1 {
            color: var(--accent-gold);
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .school-header h2 {
            color: #a0c4ff;
            font-size: 1rem;
            margin-top: 4px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .timer-box {
            font-size: 1.2rem;
            color: var(--accent-gold);
            margin-bottom: 12px;
            font-weight: bold;
        }

        .streak-container {
            min-height: 35px;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .streak-bubble {
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease-out;
        }

        .streak-bubble.lost {
            background: rgba(231, 29, 54, 0.15);
            border-color: var(--danger);
            color: var(--danger);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .lyric-box {
            background-color: #1d3557;
            border-left: 5px solid var(--accent-gold);
            padding: 18px;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
        }

        .missing-blank {
            color: var(--accent-gold);
            border-bottom: 2px dashed var(--accent-gold);
            padding: 0 8px;
            font-weight: bold;
            font-style: normal;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: 2px solid var(--primary-teal);
            border-radius: 8px;
            outline: none;
            margin-bottom: 15px;
            background-color: var(--light-bg);
            color: #333;
        }

        .btn {
            background-color: var(--primary-teal);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: #006666;
        }

        .lifelines {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            justify-content: center;
        }

        .btn-lifeline {
            background-color: #3a86ff;
            font-size: 0.8rem;
            padding: 8px 10px;
            flex: 1;
        }

        .btn-lifeline:disabled {
            background-color: #555;
            opacity: 0.4;
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 28px;
        }

        .feedback.correct { color: var(--success); }
        .feedback.wrong { color: var(--danger); }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="school-header">
        <h1>Seng Kang Secondary School</h1>
        <h2>Don't Forget the Lyrics!</h2>
    </div>

    <div id="game-screen">
        <div class="status-bar">
            <span>Round <span id="round-num">1</span>/10</span>
            <span>Score: <span id="score">0</span></span>
        </div>

        <div class="timer-box" id="timer-display">⏱️ Time Left: 35s</div>
        
        <div class="streak-container" id="streak-container"></div>

        <div class="lyric-box" id="lyric-prompt">
            Loading song lyrics...
        </div>

        <input type="text" id="user-input" placeholder="Type the missing lyrics here..." autocomplete="off">
        <button class="btn" id="submit-btn" onclick="checkAnswer()">Lock In Answer</button>

        <div class="lifelines">
            <button class="btn btn-lifeline" id="hint1-btn" onclick="useFirstLetter()">Hint (1st Letter)</button>
            <button class="btn btn-lifeline" id="hint2-btn" onclick="useLengthClue()">Word Count Clue</button>
            <button class="btn btn-lifeline" id="skip-btn" onclick="skipRound()">Skip Round</button>
        </div>

        <div class="feedback" id="feedback"></div>
    </div>

    <div id="end-screen" class="hidden">
        <h2>Challenge Complete!</h2>
        <p style="margin: 15px 0; font-size: 1.2rem;">Your final score: <span id="final-score" style="color: var(--accent-gold); font-weight: bold;">0</span></p>
        <button class="btn" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
    const lyricsData = [
        { before: "In this school we share one vision to which we all ", missing: "aspire", after: "." },
        { before: "To raise our skills and knowledge undaunted ever ", missing: "higher", after: "." },
        { before: "United in this purpose to succeed in all ", missing: "we do", after: "." },
        { before: "At home at work for all our ", missing: "nation's good", after: "." },
        { before: "Our goal is to ", missing: "breakthrough", after: "!" },
        { before: "Hold on! With the anchor to ", missing: "what we believe", after: "!" },
        { before: "Team up! Take the rope! ", missing: "Together we'll achieve", after: "!" },
        { before: "Breakthrough with ", missing: "heart and mind and soul", after: "." },
        { before: "Breakthrough for ", missing: "Seng Kang Secondary", after: "." },
        { before: "", missing: "Breakthrough", after: "!" }
    ];

    let currentRound = 0;
    let score = 0;
    let timeLeft = 35;
    let timerInterval;

    let currentStreak = 0;
    let hasStartedStreak = false;

    let lifeline1Used = false;
    let lifeline2Used = false;
    let lifeline3Used = false;

    function startTimer() {
        timeLeft = 35;
        document.getElementById('timer-display').innerText = `⏱️ Time Left: ${timeLeft}s`;
        clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-display').innerText = `⏱️ Time Left: ${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timeOutAnswer();
            }
        }, 1000);
    }

    function updateStreakDisplay(status) {
        const container = document.getElementById('streak-container');
        if (status === 'none') {
            container.innerHTML = '';
            return;
        }
        if (status === 'active') {
            container.innerHTML = `<div class="streak-bubble">🔥 Streak ×${currentStreak}</div>`;
        } else if (status === 'lost') {
            container.innerHTML = `<div class="streak-bubble lost">❌ Streak Lost!</div>`;
        }
    }

    function loadRound() {
        const data = lyricsData[currentRound];
        document.getElementById('round-num').innerText = currentRound + 1;
        document.getElementById('lyric-prompt').innerHTML = `"${data.before}<span class="missing-blank">???</span>${data.after}"`;
        document.getElementById('user-input').value = '';
        document.getElementById('feedback').innerText = '';
        startTimer();
    }

    function cleanString(str) {
        return str.toLowerCase().replace(/[^\w\s]/gi, '').trim();
    }

    function timeOutAnswer() {
        const targetAns = lyricsData[currentRound].missing;
        const feedback = document.getElementById('feedback');
        feedback.className = 'feedback wrong';
        feedback.innerText = `⏰ Time's up! The answer was: "${targetAns}"`;

        if (hasStartedStreak && currentStreak > 0) {
            currentStreak = 0;
            updateStreakDisplay('lost');
        } else {
            updateStreakDisplay('none');
        }

        nextRound(2500);
    }

    function checkAnswer() {
        clearInterval(timerInterval);
        const userAns = document.getElementById('user-input').value;
        const targetAns = lyricsData[currentRound].missing;
        const feedback = document.getElementById('feedback');

        if (cleanString(userAns) === cleanString(targetAns)) {
            hasStartedStreak = true;
            currentStreak++;

            // Base score (100) + Speed Bonus + Streak Bonus (+100 per streak count)
            const streakBonus = currentStreak * 100;
            const roundPoints = 100 + (timeLeft * 5) + streakBonus;
            score += roundPoints;
            
            document.getElementById('score').innerText = score;
            feedback.className = 'feedback correct';
            feedback.innerText = `Correct! Breakthrough! (+${streakBonus} Streak Bonus!)`;

            updateStreakDisplay('active');
            nextRound(1500);
        } else {
            feedback.className = 'feedback wrong';
            feedback.innerText = `Wrong! The correct lyric was: "${targetAns}"`;

            if (hasStartedStreak && currentStreak > 0) {
                currentStreak = 0;
                updateStreakDisplay('lost');
            } else {
                updateStreakDisplay('none');
            }

            nextRound(2500);
        }
    }

    function nextRound(delay) {
        setTimeout(() => {
            currentRound++;
            if (currentRound < lyricsData.length) {
                loadRound();
            } else {
                endGame();
            }
        }, delay);
    }

    function useFirstLetter() {
        if (lifeline1Used) return;
        const targetAns = lyricsData[currentRound].missing;
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('feedback').innerText = `Hint: Starts with '${targetAns.charAt(0).toUpperCase()}'`;
        document.getElementById('hint1-btn').disabled = true;
        lifeline1Used = true;
    }

    function useLengthClue() {
        if (lifeline2Used) return;
        const words = lyricsData[currentRound].missing.split(' ').length;
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('feedback').innerText = `Clue: Missing phrase contains ${words} word(s).`;
        document.getElementById('hint2-btn').disabled = true;
        lifeline2Used = true;
    }

    function skipRound() {
        if (lifeline3Used) return;
        clearInterval(timerInterval);
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('feedback').innerText = 'Round Skipped!';
        document.getElementById('skip-btn').disabled = true;
        lifeline3Used = true;
        nextRound(1000);
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
    }

    function restartGame() {
        currentRound = 0;
        score = 0;
        currentStreak = 0;
        hasStartedStreak = false;
        updateStreakDisplay('none');

        lifeline1Used = false;
        lifeline2Used = false;
        lifeline3Used = false;
        document.getElementById('hint1-btn').disabled = false;
        document.getElementById('hint2-btn').disabled = false;
        document.getElementById('skip-btn').disabled = false;
        document.getElementById('score').innerText = 0;
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadRound();
    }

    loadRound();
</script>
</body>
</html>
